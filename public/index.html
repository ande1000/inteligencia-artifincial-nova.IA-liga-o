<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nova.IA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

    <!-- ========================================== -->
    <!-- TELA 1: CHAT DE TEXTO (TELA INICIAL)       -->
    <!-- ========================================== -->
    <div id="home-screen" class="screen">
        <header>
            <div class="logo-icon">✨</div>
            <h1>nova.IA</h1>
            <p>ANDERSON O CRIADOR DA INTELIGENCIA ARTIFICIAL</p>
            
            <!-- 🌟 SELETOR DE VOZES -->
            <div class="voice-selector-container">
                <label for="voice-select">Escolha a voz:</label>
                <select id="voice-select"></select>
            </div>
        </header>

        <main class="chat-container">
            <!-- Caixa de mensagens vazia, as mensagens aparecerão aqui -->
            <div id="chat-messages" class="chat-messages"></div>
        </main>

        <footer class="home-footer">
            <div class="input-wrapper">
                <input type="text" id="text-input" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
                <button id="send-btn" onclick="sendTextMessage()">➤</button>
            </div>
            <!-- Botão Azul para Ligar -->
            <button id="call-btn" class="btn-blue" onclick="startCall()">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </button>
        </footer>
    </div>

    <!-- ========================================== -->
    <!-- TELA 2: CHAMADA DE VOZ                     -->
    <!-- ========================================== -->
    <div id="call-screen" class="screen hidden">
        <header>
            <h1>nova.IA</h1>
            <p>ANDERSON O CRIADOR DA INTELIGENCIA ARTIFICIAL</p>
            <!-- 🌟 SELETOR DE VOZES (TAMBÉM NA TELA DE CHAMADA) -->
            <div class="voice-selector-container">
                <label for="voice-select-call">Escolha a voz:</label>
                <select id="voice-select-call"></select>
            </div>
        </header>

        <main>
            <div id="circle" class="circle"></div>
        </main>

        <footer>
            <div class="btn-container">
                <button id="off-btn" class="btn-green" onclick="endCall()">off</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
